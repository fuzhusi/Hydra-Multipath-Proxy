# Hydra 节点内核网络加固（BBR + fq）
# 安装: sudo cp deploy/99-hydra-bbr.conf /etc/sysctl.d/ && sudo sysctl --system
# 验证: sysctl net.ipv4.tcp_congestion_control   # 应输出 bbr
#       sysctl net.core.default_qdisc            # 应输出 fq
#
# 依据：docs/design/TCP传输协议优化评估.md P0 项——跨境高丢包链路上
# BBR（内核级拥塞控制）显著优于默认 CUBIC；fq 队列是 BBR 的推荐搭配。
# 节点侧生效即可覆盖「节点→客户端」下载主方向；客户端侧无需配置
#（Windows/macOS 桌面系统无内核 BBR，属已知限制，如实标注）。

net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
