# ══════════════════════════════════════════════════════════════════
# Hydra 节点 toml 配置文件样例（hydra-node）
#
# 启用方式（三选一）:
#   1. 环境变量 HYDRA_NODE_CONFIG=/etc/hydra/node.toml
#   2. CLI 参数 --config /etc/hydra/node.toml
#   3. 自动探测: 进程工作目录 ./node.toml → /etc/hydra/node.toml
#
# 优先级: CLI 参数 > 环境变量 > 本文件 > 内置默认值（逐字段独立回落）
# 每个字段注释里标注对应 env 名与默认值；未知字段 / 非法值 = 启动报错退出。
#
# ⚠ 密钥安全: 认证密钥优先级 HYDRA_AUTH_KEY > HYDRA_AUTH_KEY_FILE >
#   本文件 auth_key_file。不要把密钥明文写进本文件（toml 常为
#   world-readable）；密钥文件必须 chmod 600。obfs 模式的
#   HYDRA_OBFS_KEY 仅支持环境变量（两端一致）。
# ══════════════════════════════════════════════════════════════════

# QUIC 监听地址。env: HYDRA_LISTEN ｜ 默认 "0.0.0.0:8080"（公网节点推荐 0.0.0.0:443）
listen_addr = "0.0.0.0:443"

# 传输模式: masquerade（伪装标准 h3）| obfs（ChaCha20 全包随机化逃生舱）。
# 两端必须一致；obfs 还需环境变量 HYDRA_OBFS_KEY。
# env: HYDRA_MODE ｜ 默认 "masquerade"
mode = "masquerade"

# 认证密钥文件（内容为 hex，解码后至少 16 字节；生成: openssl rand -hex 32，
# 用 vi 直接编辑，权限 chmod 600，非 0600 启动时告警）。
# env: HYDRA_AUTH_KEY_FILE ｜ 默认无（未配 HYDRA_AUTH_KEY 时必须提供）
auth_key_file = "/etc/hydra/auth.key"

# 最大并发 QUIC 连接数（防 pre-auth 资源耗尽）。
# env: HYDRA_MAX_CONNECTIONS ｜ 默认 1000
max_connections = 1000

# 证书/私钥持久化路径（首次启动自动生成自签证书，重启不换证书）。
# env: HYDRA_CERT_FILE / HYDRA_KEY_FILE ｜ 默认 ./hydra-node-cert.der / ./hydra-node-key.der
cert_file = "/etc/hydra/hydra-node-cert.der"
key_file = "/etc/hydra/hydra-node-key.der"

# 证书 SAN 域名列表。env: HYDRA_CERT_DOMAINS（逗号分隔）｜ 默认 ["hydra.node", "localhost"]
cert_domains = ["hydra.node", "localhost"]

# 健康检查端点（GET /health → JSON: status/mode/uptime_secs/version/public_addr）。
# 只绑本机回环，切勿绑 0.0.0.0（避免额外暴露面）。
# env: HYDRA_HEALTH_ADDR ｜ 默认未设置 = 关闭
health_addr = "127.0.0.1:8081"

# STUN 公网地址发现（RFC5389 Binding，修复死代码后的最小正确实现）：
# 启动时及每 10 分钟向该服务器查询公网映射地址，报入 /health 的 public_addr。
# 必须是 ip:port 字面量（不做 DNS 解析）；完整 P2P 打洞 = V3.5 需信令设计。
# env: HYDRA_STUN_ADDR ｜ 默认未设置 = 关闭。Google 公共 STUN 示例（IP 会轮换，
# 可用 `dig +short stun.l.google.com` 取当前值）：
# stun_addr = "74.125.250.129:19302"

# 日志级别（RUST_LOG 存在时优先于本字段与 HYDRA_LOG_LEVEL）。
# env: HYDRA_LOG_LEVEL ｜ 默认 "info"
log_level = "info"
