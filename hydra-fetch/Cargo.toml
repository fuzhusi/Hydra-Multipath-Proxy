[package]
name = "hydra-fetch"
version = "0.2.2"
edition = "2021"
description = "Hydra 多节点并行下载器：HTTP Range 分块 + 按节点评分加权 + 断点续传（经 hydra 加密隧道）"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
hydra-core = { path = "../hydra-core" }
hydra-protocol = { path = "../hydra-protocol" }
ring = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
webpki-roots = "0.26"

[[bin]]
name = "hydra-fetch"
path = "src/main.rs"
