[package]
name = "hydra-client-gui"
version = "0.2.1"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"

[dependencies]
eframe = "0.27"
egui = "0.27"
# UI 重设计第三批：总览页仪表盘实时速率双曲线（与 egui/eframe 0.27 版本锁齐）
egui_plot = "0.27"
# 版本统一由根 [workspace.dependencies] 声明（审查 R-31）
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
rfd = "0.17"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = "0.4"
# Exec-C：订阅拉取（轻量阻塞 HTTP，含 rustls https；GUI 后台线程调用，不进解析层依赖）
ureq = "2"
# Team-Q：二维码生成（fast_qr）与识别（rqrr + image，仅 png/jpeg 减体积）
fast_qr = "0.12"
rqrr = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
base64 = { workspace = true }
# T2：系统托盘（Tauri 官方库；Windows 下事件经全局通道投递，GUI 线程轮询即可）
tray-icon = "0.19"
# TUN 透明代理入口（tun_config_from_settings / run_tun / 环路检测）依赖 tun feature
hydra-client = { path = "../hydra-client", features = ["tun"] }
hydra-protocol = { path = "../hydra-protocol" }

# A1：Windows 系统代理（注册表写入 + WinINet 刷新），target-gated
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.52", features = ["Win32_Networking_WinInet", "Win32_Foundation"] }

# Windows exe 资源图标（桌面快捷方式/任务栏/资源管理器）：build.rs 仅在 Windows 宿主编译时生效
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"