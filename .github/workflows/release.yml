# Hydra 发布：push tag v* 触发（也可在 Actions 页手动 workflow_dispatch 触发以测试安装包）。
# 产物：
# - Windows 安装包: Hydra-Setup-<版本>-x64.exe（NSIS，自动包含官方签名 wintun.dll）
# - Windows 便携包: hydra-windows-x64.zip（已内置 wintun.dll，解压即用）
# - Linux:   hydra-node 打 tar.gz
# - Android: hydra-android-<版本>.apk（release 构建、R8 优化；签名优先级：`n#   HYDRA_KEYSTORE_PATH/PASSWORD Secrets → 仓库 keystore（本地）→ debug 签名回退）
# 注意：wintun.dll 从官方 https://www.wintun.net/ 下载（0.14.1，WireGuard LLC 签名），
#       不进仓库（体积）；amd64 架构随包分发。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 与上传产物所需

env:
  CARGO_TERM_COLOR: always
  WINTUN_VERSION: 0.14.1

jobs:
  build-windows:
    name: Windows 产物（安装包 + 便携包）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: cargo build --release
        run: cargo build --release --workspace

      # 汇集分发文件：主程序 + README 进 dist（便携 zip 与 NSIS 安装包共用此目录）
      - name: 汇集构建产物到 dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/hydra-client-gui.exe dist/
          Copy-Item target/release/hydra-client.exe dist/
          Copy-Item target/release/hydra-fetch.exe dist/
          Copy-Item README.md dist/
          Get-ChildItem dist

      # 官方签名 wintun.dll（WireGuard LLC），TUN 模式必需
      - name: 下载 wintun.dll（官方 0.14.1 amd64）
        shell: pwsh
        run: |
          curl.exe -L --connect-timeout 30 --max-time 300 `
            -o wintun.zip https://www.wintun.net/builds/wintun-$($env:WINTUN_VERSION).zip
          Expand-Archive -Path wintun.zip -DestinationPath wintun-extracted -Force
          Copy-Item "wintun-extracted/wintun/bin/amd64/wintun.dll" dist/wintun.dll
          # 供应链门禁（评审 P1-1）：签名必须 Valid 且签发者为 WireGuard，
          # 否则构建失败——只打印不拦截等于没有校验
          $sig = Get-AuthenticodeSignature dist/wintun.dll
          if ($sig.Status -ne 'Valid') {
            Write-Error "wintun.dll 签名校验失败: $($sig.Status)——中止构建（供应链防护）"
            exit 1
          }
          if ($sig.SignerCertificate.Subject -notmatch 'WireGuard') {
            Write-Error "wintun.dll 签发者非 WireGuard: $($sig.SignerCertificate.Subject)——中止构建"
            exit 1
          }
          $sig | Select-Object Status, SignerCertificate

      # 便携 zip：exe + wintun.dll + README（解压即用）
      - name: 打包便携 zip
        shell: pwsh
        run: |
          @'
          TUN 模式说明:
          - wintun.dll 已内置（官方 0.14.1 amd64 签名版），无需自行下载
          - TUN 需以管理员身份运行 GUI
          - 反代静态页/TUN 开关见 README
          '@ | Set-Content -Path dist/WINTUN-README.txt -Encoding utf8
          Compress-Archive -Path dist/* -DestinationPath hydra-windows-x64.zip

      # NSIS 安装包：双击安装到 Program Files，自动创建快捷方式 + 卸载器。
      # 注意：choco 装的 NSIS 在 C:\Program Files (x86)\NSIS，runner 的 PATH 在
      # job 启动时已固定（安装期新增的 PATH 后续步骤不可见）——必须显式全路径
      # 调用 makensis（此前 v0.2.1 tag 构建即因 makensis 不在 PATH 失败）。
      - name: 安装 NSIS
        run: choco install nsis -y --no-progress

      - name: 生成 NSIS 安装包
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DAPPVERSION=${{ github.ref_name }} packaging\hydra.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist/Hydra-Setup-*.exe")) {
            Write-Error "NSIS 产物未生成到 dist/（检查 .nsi OutFile 路径）"; exit 1
          }
          Get-ChildItem dist

      - name: 上传到 GitHub Release（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Hydra-Setup-*.exe
            hydra-windows-x64.zip
          generate_release_notes: true

      - name: 上传构建产物（手动触发时，供下载测试）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: hydra-windows-dist
          path: |
            dist/Hydra-Setup-*.exe
            hydra-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Linux 产物（hydra-node）
    # 固定 24.04：ubuntu-latest 2026-10-19 起迁 Ubuntu 26（同 ci.yml 注释）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      # 构建节点 + 下载器（Linux 产物定位是 VPS 服务端/服务器侧工具；客户端 GUI 走 Windows 包）
      - name: cargo build --release -p hydra-node -p hydra-fetch
        run: cargo build --release -p hydra-node -p hydra-fetch

      - name: 打包 tar.gz
        run: |
          mkdir -p dist
          cp target/release/hydra-node dist/
          cp target/release/hydra-fetch dist/
          cp README.md dist/
          cp deploy/hydra-node.service dist/
          cp deploy/install.sh dist/
          cp deploy/env.example dist/
          tar -czf hydra-linux-x64.tar.gz -C dist .

      - name: 上传到 GitHub Release（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: hydra-linux-x64.tar.gz
          generate_release_notes: true

      - name: 上传构建产物（手动触发时）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: hydra-linux-dist
          path: hydra-linux-x64.tar.gz
          if-no-files-found: error

  build-android:
    name: Android 产物（release APK，R8 优化 + 签名回退链）
    # 固定 24.04（同 build-linux）；runner 预装 Android SDK（ANDROID_HOME）。
    # APK 为 debug 签名（与本地 gradlew assembleDebug 一致，供侧载）——正式
    # release 签名需 keystore 仓库密钥，未配置前不冒充（如实标注）。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 安装 JDK 17（AGP 8.x 要求）+ gradle 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 安装 Rust 工具链（含 Android 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: 缓存 cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-android-

      - name: 安装 cargo-ndk（预编译二进制）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # runner 预装 SDK 但 NDK 版本不定——幂等安装固定版（与本地一致）；
      # build-rust.sh 按 $ANDROID_HOME/ndk/* 自动发现
      - name: 安装 NDK 27.2（幂等）
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null

      # preBuild 钩子自动调 scripts/build-rust.sh 交叉编译 libhydra_android.so
      - name: gradle assembleDebug（含 Rust 交叉编译）
        working-directory: android
        run: bash ./gradlew assembleRelease --console=plain --no-daemon

      # 门禁：build-rust.sh 缺 cargo-ndk/NDK 时静默跳过仍退出 0——
      # 无此检查会发出无原生库的空壳 APK
      - name: 校验 APK 内嵌原生库（双 ABI）
        run: |
          for abi in arm64-v8a x86_64; do
            unzip -l android/app/build/outputs/apk/release/app-release.apk \
              | grep -q "lib/$abi/libhydra_android.so" \
              || { echo "APK 缺少 lib/$abi/libhydra_android.so——Rust 交叉编译被跳过？"; exit 1; }
          done

      - name: 重命名 APK（带 tag 版本）
        run: cp android/app/build/outputs/apk/release/app-release.apk "hydra-android-${{ github.ref_name }}.apk"

      - name: 上传到 GitHub Release（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: hydra-android-*.apk
          generate_release_notes: true

      - name: 上传构建产物（手动触发时）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: hydra-android-dist
          path: hydra-android-*.apk
          if-no-files-found: error
