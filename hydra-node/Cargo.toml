[package]
name = "hydra-node"
version = "0.2.1"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"

[[bin]]
name = "hydra-node"
path = "src/main.rs"

[dependencies]
# 版本统一由根 [workspace.dependencies] 声明（审查 R-31）
tokio = { workspace = true }
rustls = { workspace = true }
# TCP/TLS 传输（与 rustls 0.23 兼配的 tokio 适配层，Wave 3 升级）
tokio-rustls = { workspace = true }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = "0.8"
anyhow = { workspace = true }
thiserror = { workspace = true }
# rcgen 0.13（Wave 3 随 rustls 0.23 升级）：内部 ring 0.17，与全工作区单 ring 对齐；
# KeyPair::serialize_der 产 PKCS#8 DER，与 PrivateKeyDer::Pkcs8 直接兼容
rcgen = "0.14"
# 真证书部署（审查协议评估 P0）：解析 ACME 产出的 PEM fullchain/key。
# 2.x 返回 rustls-pki-types 的 CertificateDer/PrivateKeyDer（Wave 3 随 rustls 0.23 升级）
rustls-pemfile = "2"
hydra-protocol = { path = "../hydra-protocol" }

[dev-dependencies]
# 信令集成测试复用客户端认证路径（connect_target）；与 hydra-client 对 hydra-node
# 的 dev 依赖构成允许的 dev 环（无普通依赖环）
hydra-client = { path = "../hydra-client" }
