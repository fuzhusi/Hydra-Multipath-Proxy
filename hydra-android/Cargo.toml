[package]
name = "hydra-android"
version = "0.2.1"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
description = "Hydra Android 绑定层：uniffi 导出 HydraEngine（进程内 SOCKS 引擎），桌面不用此 crate"

[lib]
name = "hydra_android"
crate-type = ["lib", "cdylib"]

[[bin]]
# Kotlin 绑定生成器：cargo run --bin uniffi-bindgen -- generate --library ...
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
hydra-core = { path = "../hydra-core" }
hydra-protocol = { path = "../hydra-protocol" }
# 版本统一由根 [workspace.dependencies] 声明（审查 R-31）
tokio = { workspace = true }
tracing = { workspace = true }
# 分享/订阅导入（证书 DER base64 编码交付 Kotlin）
base64 = { workspace = true }
# uniffi：Rust→Kotlin 绑定（proc-macro 导出风格；cli feature 供 bindgen bin）
uniffi = { version = "0.29", features = ["cli"] }
# 显式错误类型（uniffi::Error derive 要求 thiserror 风格）
thiserror = { workspace = true }
