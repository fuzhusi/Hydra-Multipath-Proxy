[package]
name = "hydra-node"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hydra-node"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
rustls = "0.21"
# TCP/TLS 传输（与 rustls 0.21 兼配的 tokio 适配层）
tokio-rustls = "0.24"
ring = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
anyhow = "1"
thiserror = "1"
rcgen = "0.10"
# 真证书部署（审查协议评估 P0）：解析 ACME 产出的 PEM fullchain/key
rustls-pemfile = "1"
hydra-protocol = { path = "../hydra-protocol" }

[dev-dependencies]
# 信令集成测试复用客户端认证路径（connect_target）；与 hydra-client 对 hydra-node
# 的 dev 依赖构成允许的 dev 环（无普通依赖环）
hydra-client = { path = "../hydra-client" }
