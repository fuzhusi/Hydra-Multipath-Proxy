[package]
name = "hydra-client-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.27"
egui = "0.27"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
hydra-client = { path = "../hydra-client" }
hydra-protocol = { path = "../hydra-protocol" }

# A1：Windows 系统代理（注册表写入 + WinINet 刷新），target-gated
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.52", features = ["Win32_Networking_WinInet", "Win32_Foundation"] }