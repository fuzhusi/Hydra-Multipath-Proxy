[package]
name = "hydra-client"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hydra-client"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
quinn = "0.10"
# 直接依赖 quinn-proto 以实现 congestion::Controller trait（与 quinn 0.10 同一 0.10.x 实例）
quinn-proto = "0.10"
rustls = "0.21"
ring = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "1"
rcgen = "0.10"
url = "2.5"
base64 = "0.22"
crossbeam-queue = "0.3"
rand = "0.8"
hydra-protocol = { path = "../hydra-protocol" }
hydra-obfs = { path = "../hydra-obfs" }

[dev-dependencies]
hydra-node = { path = "../hydra-node" }
# test_handshake_v3：snow 官方 API 直造 msg1（篡改测试）；rustls 用于 peer cert 下cast
snow = { version = "0.9", default-features = false, features = ["default-resolver", "ring-resolver"] }
rustls = "0.21"