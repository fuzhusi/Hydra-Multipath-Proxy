[package]
name = "hydra-client"
version = "0.2.0"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"

[[bin]]
name = "hydra-client"
path = "src/main.rs"

[features]
# TUN 透明代理模式（docs/design/TUN模式方案.md）：默认开启；
# `--no-default-features` 可编出无 TUN 的最小客户端（若目标环境无法拉取
# tun2/smoltcp 依赖，允许此降级）。
default = ["tun", "fingerprint"]
tun = ["dep:tun2", "dep:smoltcp", "dep:tokio-util"]
# ClientHello 指纹"最大近似"（路线 C：stock rustls 全部可调项，见
# docs/design/ClientHello指纹模仿方案与实施.md）。纯 stock 实现、无 fork 依赖，
# 故默认开启；运行时 `HYDRA_FINGERPRINT=none` 可整体回退 stock rustls 行为。
# brotli：Chrome ClientHello 携带 certCompression(brotli)，rustls 需启用对应
# feature 才会声明该解压器。
fingerprint = ["rustls/brotli"]

[dependencies]
# 版本统一由根 [workspace.dependencies] 声明（审查 R-31）
tokio = { workspace = true }
rustls = { workspace = true }
# TCP/TLS 传输（TCP 转型 Wave 1；Wave 3 起与 rustls 0.23 匹配的 tokio 适配层）
tokio-rustls = { workspace = true }
# 真证书模式（HYDRA_TRUST=ca）：webpki 公共 CA 根，与 rustls 0.23 配套（0.26）。
# TrustAnchor 与 rustls-pki-types 统一，可直接 extend 进 RootCertStore。
webpki-roots = "0.26"
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = "2.5"
base64 = { workspace = true }
# 恢复探测周期的随机抖动（±20%，防整周期被动特征）
rand = "0.8"
hydra-protocol = { path = "../hydra-protocol" }

# ── TUN 透明代理模式（feature = "tun"）───────────────────────────────────────
# tun2 = tun-rs 系维护的 TUN crate（ssrlive/rust-tun 的 tun2 4.x）；
# Windows 走 Wintun 驱动（运行时需 wintun.dll 与 exe 同架构、同目录或 PATH），
# Linux 走 /dev/net/tun。
tun2 = { version = "4", optional = true, features = ["async"] }
# 用户态 TCP/IP 栈：TUN 收发裸 IP 包（medium-ip），只需 IPv4 + TCP socket。
smoltcp = { version = "0.11", optional = true, default-features = false, features = [
    "alloc",
    "proto-ipv4",
    # v1 完整版：IPv6 正向路径——v6 TCP 由栈直接代理（动态 AnyIP，见 tun.rs
    # ensure_v6_dst），UDP/ICMP 等 v6 非 TCP 包回 ICMPv6 不可达快速回落
    "proto-ipv6",
    "socket-tcp",
    "medium-ip",
    # 动态 AnyIP 需要地址表容量：默认仅 2 槽（放不下 v4 + 链路本地 + 全局 +
    # 轮转池），扩到 8 槽 = 3 静态 + 5 动态（见 tun.rs V6_DYNAMIC_SLOTS）
    "iface-max-addr-count-8",
] }
# CancellationToken（TUN 任务优雅停机）
tokio-util = { version = "0.7", optional = true }

[dev-dependencies]
hydra-node = { path = "../hydra-node" }
# R-42 测试缺口专项：真证书 PEM 路径 E2E 用 rcgen 生成 PEM 证书/私钥
# （0.13 与 hydra-node 主依赖同版本，内部 ring 0.17 与全工作区对齐）
rcgen = "0.13"
