[package]
name = "hydra-client-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.27"
egui = "0.27"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
# Exec-C：订阅拉取（轻量阻塞 HTTP，含 rustls https；GUI 后台线程调用，不进解析层依赖）
ureq = "2"
# Team-Q：二维码生成（fast_qr）与识别（rqrr + image，仅 png/jpeg 减体积）
fast_qr = "0.12"
rqrr = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
hydra-client = { path = "../hydra-client" }
hydra-protocol = { path = "../hydra-protocol" }

# A1：Windows 系统代理（注册表写入 + WinINet 刷新），target-gated
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.52", features = ["Win32_Networking_WinInet", "Win32_Foundation"] }