[package]
name = "hydra-node"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hydra-node"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
quinn = "0.10"
rustls = "0.21"
# Team-T：TCP/TLS 传输模式（与 rustls 0.21 匹配的 tokio 适配层）
tokio-rustls = "0.24"
ring = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
anyhow = "1"
thiserror = "1"
rcgen = "0.10"
hydra-protocol = { path = "../hydra-protocol" }
hydra-obfs = { path = "../hydra-obfs" }