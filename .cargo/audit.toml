# cargo-audit CLI 配置（CI security-scan 步骤读取）。
# unmaintained 类 advisory 默认即 warning（不阻断），此处只维护漏洞豁免表。

[advisories]
ignore = [
    # RUSTSEC-2026-0257：webbrowser < 1.2.2 Unix `BROWSER` 参数注入。
    # 传递依赖链 egui-winit 0.27 → webbrowser 0.8.x（semver 锁定，无法单独
    # 升级；根治待 eframe/egui 升级，已列入 CHANGELOG P2）。
    # 可达性复核（2026-11-03，v0.2.9.5 起 Linux 包已含 GUI——"仅 Windows
    # 产物"的旧理由作废）：webbrowser 仅在用户点击 UI 超链接时被调用，
    # 全 GUI 唯一超链接是关于页硬编码的第一方 GitHub 链接，攻击者可控
    # URL 不进入 webbrowser，注入前提不成立。与 deny.toml 同条目同步维护。
    "RUSTSEC-2026-0257",
]
