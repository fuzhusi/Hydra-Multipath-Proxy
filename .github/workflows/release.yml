# Hydra 发布：push tag v* 触发（也可在 Actions 页手动 workflow_dispatch 触发以测试安装包）。
# 产物：
# - Windows 安装包: Hydra-Setup-<版本>-x64.exe（NSIS，自动包含官方签名 wintun.dll）
# - Windows 便携包: hydra-windows-x64.zip（已内置 wintun.dll，解压即用）
# - Linux:   hydra-node 打 tar.gz
# 注意：wintun.dll 从官方 https://www.wintun.net/ 下载（0.14.1，WireGuard LLC 签名），
#       不进仓库（体积）；amd64 架构随包分发。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 与上传产物所需

env:
  CARGO_TERM_COLOR: always
  WINTUN_VERSION: 0.14.1

jobs:
  build-windows:
    name: Windows 产物（安装包 + 便携包）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: cargo build --release
        run: cargo build --release --workspace

      # 汇集分发文件：主程序 + README 进 dist（便携 zip 与 NSIS 安装包共用此目录）
      - name: 汇集构建产物到 dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/hydra-client-gui.exe dist/
          Copy-Item target/release/hydra-client.exe dist/
          Copy-Item target/release/hydra-fetch.exe dist/
          Copy-Item README.md dist/
          Get-ChildItem dist

      # 官方签名 wintun.dll（WireGuard LLC），TUN 模式必需
      - name: 下载 wintun.dll（官方 0.14.1 amd64）
        shell: pwsh
        run: |
          curl.exe -L --connect-timeout 30 --max-time 300 `
            -o wintun.zip https://www.wintun.net/builds/wintun-$($env:WINTUN_VERSION).zip
          Expand-Archive -Path wintun.zip -DestinationPath wintun-extracted -Force
          Copy-Item "wintun-extracted/wintun/bin/amd64/wintun.dll" dist/wintun.dll
          Get-AuthenticodeSignature dist/wintun.dll | Select-Object Status, SignerCertificate

      # 便携 zip：exe + wintun.dll + README（解压即用）
      - name: 打包便携 zip
        shell: pwsh
        run: |
          @'
          TUN 模式说明:
          - wintun.dll 已内置（官方 0.14.1 amd64 签名版），无需自行下载
          - TUN 需以管理员身份运行 GUI
          - 反代静态页/TUN 开关见 README
          '@ | Set-Content -Path dist/WINTUN-README.txt -Encoding utf8
          Compress-Archive -Path dist/* -DestinationPath hydra-windows-x64.zip

      # NSIS 安装包：双击安装到 Program Files，自动创建快捷方式 + 卸载器。
      # 注意：choco 装的 NSIS 在 C:\Program Files (x86)\NSIS，runner 的 PATH 在
      # job 启动时已固定（安装期新增的 PATH 后续步骤不可见）——必须显式全路径
      # 调用 makensis（此前 v0.2.1 tag 构建即因 makensis 不在 PATH 失败）。
      - name: 安装 NSIS
        run: choco install nsis -y --no-progress

      - name: 生成 NSIS 安装包
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DAPPVERSION=${{ github.ref_name }} packaging\hydra.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist/Hydra-Setup-*.exe")) {
            Write-Error "NSIS 产物未生成到 dist/（检查 .nsi OutFile 路径）"; exit 1
          }
          Get-ChildItem dist

      - name: 上传到 GitHub Release（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Hydra-Setup-*.exe
            hydra-windows-x64.zip
          generate_release_notes: true

      - name: 上传构建产物（手动触发时，供下载测试）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: hydra-windows-dist
          path: |
            dist/Hydra-Setup-*.exe
            hydra-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Linux 产物（hydra-node）
    # 固定 24.04：ubuntu-latest 2026-10-19 起迁 Ubuntu 26（同 ci.yml 注释）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      # 构建节点 + 下载器（Linux 产物定位是 VPS 服务端/服务器侧工具；客户端 GUI 走 Windows 包）
      - name: cargo build --release -p hydra-node -p hydra-fetch
        run: cargo build --release -p hydra-node -p hydra-fetch

      - name: 打包 tar.gz
        run: |
          mkdir -p dist
          cp target/release/hydra-node dist/
          cp target/release/hydra-fetch dist/
          cp README.md dist/
          cp deploy/hydra-node.service dist/
          cp deploy/install.sh dist/
          cp deploy/env.example dist/
          tar -czf hydra-linux-x64.tar.gz -C dist .

      - name: 上传到 GitHub Release（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: hydra-linux-x64.tar.gz
          generate_release_notes: true

      - name: 上传构建产物（手动触发时）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: hydra-linux-dist
          path: hydra-linux-x64.tar.gz
